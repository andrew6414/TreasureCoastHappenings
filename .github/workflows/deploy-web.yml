name: Build and deploy web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install Expo web dependencies
        run: npx expo install react-dom react-native-web @expo/metro-runtime
      - name: Export web app
        run: npx expo export --platform web
      - name: Add agency website
        run: mkdir -p dist/studio && cp -R studio/. dist/studio/
      - name: Add JobMargin website
        run: mkdir -p dist/jobmargin && cp -R jobmargin/. dist/jobmargin/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
